; T-053 (ZAP baseline scan): PHP's default X-Powered-By header leaks the
; exact PHP version to every response — a low-risk info-disclosure finding,
; standard hardening to turn off in any real deployment.
expose_php=Off

; 2026-11-02 (CEO-approved): turn off session upload progress tracking.
; Reason: PHP vulnerability CVE-2026-115560 per the ThaiCERT notice. CMIS does
; not use this feature. The advisory does not yet state affected versions, so
; this is a precaution. Re-check once versions are published.
session.upload_progress.enabled=0
