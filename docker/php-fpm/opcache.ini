; Production-style OPcache: compiled once per pool (shared across every
; php-fpm worker via shared memory), not per-process like `php artisan
; serve`'s multi-worker mode — this is what actually fixes the "each new
; worker pays a cold-compile tax" issue found during NFR-01 testing.
opcache.enable=1
opcache.validate_timestamps=0
opcache.memory_consumption=128
opcache.max_accelerated_files=20000
