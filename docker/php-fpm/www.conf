; NFR-01 load test / production-representative pool — the stock php-fpm image
; ships pm.max_children=5, which alone would cap this app at 5 concurrent
; requests regardless of anything else. Static (not dynamic) so all worker
; processes exist upfront, matching how a real deployment would be sized for
; its expected concurrent load rather than scaled up reactively mid-spike.
[www]
user = www-data
group = www-data
listen = 9000
pm = static
pm.max_children = 60
