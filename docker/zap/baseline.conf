# T-053 (OWASP ZAP Baseline Scan, spec §14 AC #10 — must find no Medium+ risk
# alerts). Only rules with an explicit, documented waiver are listed here;
# every other rule keeps ZAP's own default threshold (WARN — informational,
# does not fail the scan). Run with: zap-baseline.py -t <target> -c
# docker/zap/baseline.conf ... (see CLAUDE.md's T-053 notes for the full
# scan command and how these two findings were investigated).

# CSP: script-src 'unsafe-eval' / style-src 'unsafe-inline' (Medium risk,
# same underlying rule for both directives). User-approved 2026-08-31, deep
# root cause and justification recorded in CLAUDE.md's CSP section: Livewire
# 3 is built directly on Alpine.js's eval-based expression engine (every
# wire:click/wire:model/x-data evaluates through it), and neither ships a
# CSP-strict build — there is no way to keep this project's chosen stack's
# reactivity without this exception. script-src still carries a per-request
# nonce and rejects any unnonced injected <script>; style-src's inline
# styles are Livewire's own core JS (loading/dirty state), not arbitrary
# user input. Accepted as a standing, documented risk — not a bug to fix.
10055	IGNORE	(CSP unsafe-eval/unsafe-inline — Livewire 3 requirement, user-approved 2026-08-31, see CLAUDE.md)

# "Bypassing 403" (T-056 active scan). Confirmed false positive by hand:
# ZAP flagged sending `X-Original-URL: /build` to `/` as a possible access-
# control bypass, but nginx/Laravel never read that header at all — manually
# re-tested against a genuinely protected route (/admin/users, unauthenticated)
# with and without the header and got an identical 302-to-login both times,
# and against `/` (already public) with the same no-op result. Nothing in
# this app's nginx config or Laravel routing gives that header any special
# meaning, so there is no real bypass here — investigated 2026-09-09, see
# CLAUDE.md's T-056 notes.
40038	IGNORE	(Bypassing 403 — false positive, X-Original-URL header has no effect here, verified by hand 2026-09-09)
