# NFR-01 load test / production-representative front end — standard Laravel
# nginx+PHP-FPM server block. Not used by normal `docker compose exec app ...`
# dev workflows (those still go through the `app` service's `php artisan
# serve`); this exists so NFR-01 can be tested against something that
# actually resembles a real deployment.

# T-053 (ZAP baseline scan): nginx's own version string in the Server header
# is a low-risk info-disclosure finding — this is the standard, global way to
# turn it off.
server_tokens off;

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 20m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass fpm:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 60;
    }

    # T-053: static assets (CSS/JS/fonts) are served directly by nginx, never
    # reaching Laravel's SecurityHeaders middleware — ZAP flagged the gap
    # (missing X-Content-Type-Options/Permissions-Policy/COEP) on exactly
    # these paths. Applied here rather than duplicating the app's full CSP
    # (which is response/nonce-specific and belongs to actual page renders,
    # not static files). Falls through to PHP (not a hard 404) when the path
    # doesn't exist as a real file — e.g. /sitemap.xml, which must still get
    # its 404 from Laravel's own fallback route to carry the app's real CSP.
    location ~* \.(css|js|woff2?|ttf|svg|png|jpe?g|gif|ico|txt|xml)$ {
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Permissions-Policy "geolocation=(), camera=(self), microphone=(), payment=()" always;
        add_header Cross-Origin-Embedder-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        try_files $uri /index.php?$query_string;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
