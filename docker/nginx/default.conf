# NFR-01 load test / production-representative front end — standard Laravel
# nginx+PHP-FPM server block. Not used by normal `docker compose exec app ...`
# dev workflows (those still go through the `app` service's `php artisan
# serve`); this exists so NFR-01 can be tested against something that
# actually resembles a real deployment.
server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 20m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass fpm:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 60;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
